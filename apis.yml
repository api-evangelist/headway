name: Headway
description: Headway operates a national mental-health care platform that connects patients, therapists
  and psychiatrists, and insurance companies. Founded in 2019 and headquartered in New York, Headway builds
  the first asset-free national network of behavioral-health providers who accept insurance, handling
  insurance credentialing, claims management, payments, and scheduling for clinicians while letting patients
  search for in-network providers, book appointments online, and see costs up front. The company partners
  with 45+ major insurers (Aetna, Anthem, Cigna, Oxford, UnitedHealthcare, Oscar) and, as of 2026, powers
  600,000+ appointments per month across all 50 states. Headway is backed by a16z, Thrive, Accel, GV,
  Spark Capital, and Forerunner. It maintains SOC 2 Type II and HIPAA compliance. Headway does not currently
  publish a public developer API or developer portal.
